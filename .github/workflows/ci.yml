name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['Casks/**', '**.md', 'LICENSE', 'NOTICE']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Build universal app
        run: ./build.sh --no-install
      - name: Test and verify bundle
        run: ./scripts/test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClaudePersonas-ci
          path: build/ClaudePersonas-*.zip
